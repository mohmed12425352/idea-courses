services:
  - type: web
    name: idea-courses-apps-cloud
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4500
      - key: DATABASE_URL
        fromDatabase:
          name: idea-courses-apps-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SIGNED_URL_SECRET
        generateValue: true

databases:
  - name: idea-courses-apps-db
    plan: free
